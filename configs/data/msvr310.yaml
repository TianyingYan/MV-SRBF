defaults:
  - ./base

dataset:
  name: "MSVR310"
  num_modalities: 3
  num_classes: 155
  modalities: {modal1: "RGB", modal2: "NIR", modal3: "TIR"}

input:
  normalize:
    modal1: {mean: [0.3151, 0.3046, 0.3005], std: [0.2526, 0.2513, 0.2486]}
    modal2: {mean: [0.4140, 0.4140, 0.4140], std: [0.2311, 0.2311, 0.2311]}
    modal3: {mean: [0.7657, 0.3557, 0.3226], std: [0.2578, 0.2722, 0.2193]}
    
dataloader:
  train:
    drop_last: false
    sampler:
      name: "unique"
      aux_dims: [0]
